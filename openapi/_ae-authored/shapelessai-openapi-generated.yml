components:
  schemas:
    PostApiCapabilitiesIdWantRequest:
      type: object
      properties:
        email:
          type: string
        webhookUrl:
          type: string
    PatchApiGroupsIdRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
    PutApiMeEmailRequest:
      type: object
      properties:
        lifecycle:
          type: boolean
          description: true to enable lifecycle email
      required:
      - lifecycle
    GetApiPostsIdResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        inspiration:
          type: object
        metrics:
          type: object
    PostApiPostsIdIdRequest:
      type: object
      properties:
        budgetCents:
          type: integer
        days:
          type: integer
        objective:
          type: string
      required:
      - budgetCents
      - days
      - objective
    PostApiV1JobsRequest:
      type: object
      properties:
        goal:
          type: string
        label:
          type: string
        budgetUsd:
          type: string
        timezone:
          type: string
        attachments:
          type: string
        characters:
          type: string
      required:
      - goal
    PostApiV1JobsResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
    PostApiApiidRequest:
      type: object
      properties:
        name:
          type: string
        prompt:
          type: string
        aspectRatio:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
