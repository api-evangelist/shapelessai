aid: shapelessai

name: ShapelessAI

image: https://shapelessai.com/opengraph-image?d1f04df5468e4746

description: ShapelessAI provides an agentic social media automation platform that creates, designs, and publishes posts, carousels, and short
  videos across major social networks. Users input a brief description of their product; the AI researches current market trends, generates content,
  and schedules it, delivering compounded traffic growth. The service offers a free tier with limited daily posts and paid plans starting at $35/month
  for higher caps and credits. It supports API, CLI, and MCP integrations, enabling developers to drive the agents programmatically.

